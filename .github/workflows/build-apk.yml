name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create full Flutter project structure
        run: |
          mkdir -p /tmp/custom
          cp -r lib /tmp/custom/ || true
          cp pubspec.yaml /tmp/custom/ || true
          cp -r .github /tmp/custom/ || true
          cp README.md /tmp/custom/ || true
          cp analysis_options.yaml /tmp/custom/ || true
          
          flutter create . --project-name fit_tick --org com.example --platforms=android
          
          cp -r /tmp/custom/lib/* lib/ || true
          cp /tmp/custom/pubspec.yaml . || true
          cp -r /tmp/custom/.github . || true
          cp /tmp/custom/README.md . || true
          cp /tmp/custom/analysis_options.yaml . || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitTick-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
